# Cockpit 配置宪法（机器可读）。系统每次运行先读它。详见 配置宪法_CONFIG_v1.md
account:
  net_liq_fallback: 159240        # 仅在 IBKR 掉线时用的兜底净值（2026-08-22 同步）；正常每次从 IBKR 取
  total_assets_usd: 250000        # 总资产(Schwab 100k + IBKR 150k); 单票硬顶基数
  schwab_core: { instrument: QQQ, target_usd: 100000, note: "被动长期；D1 已定(2026-06-27)=立即30%+手动月定投30%x6+回调子弹40%(674/636 整数股GTC)，见 QQQ建仓方案_2026-06.md" }

strategy: momentum_mainline + serenity_chokepoint   # 跟热点、不强行分散

holdings:                          # 角色注释 + IBKR 掉线兜底（B33 起持仓名单由 live Flex 驱动；IBKR 票=吉祥物，已排除；2026-08-22 对 live 同步）
  - { ticker: NVDA, role: "半导体/主线龙头" }
  - { ticker: MU,   role: "内存HBM双雄之一/超$30k硬顶（减仓信号持续中）" }
  - { ticker: SKHY, role: "SK海力士ADR/第一大仓、超$30k硬顶（FMP已核=SK hynix Inc./NASDAQ，CIK 2120882；Flex代码2026-08起为SKHY，曾用SKHYV）" }
  - { ticker: ORCL, role: "企业软件+OCI 云基础设施；Software-Infrastructure，CEO Michael D. Sicilia，14.1万员工（核实 2026-08-25，源=FMP profile）。⚠️ 债务 $104B→$156B（一年 +50%，源=FMP enterprise-values），AI capex 加杠杆是当前主要风险，不是稀释。破位·全组合最弱（RS −25）" }
  - { ticker: MRVL, role: "半导体/定制ASIC（禁再加仓，守20日低失效线）" }
  - { ticker: AVGO, role: "半导体（定制 AI ASIC / 网络）**+ 基础设施软件（VMware）双主业**——原注释只写了半导体那一半。CEO Hock Tan（核实 2026-08-25，源=FMP profile）。2026-08 有 AI 融资安排的新闻，规模口径不一，我未读原始文件，未采信" }
  - { ticker: KLAC, role: "半导体过程控制：晶圆/掩模检测与量测（不是前道制程设备）。**2026-06-12 十股拆一股（10:1）**——日报曾报流通股 YoY +890% 疑似稀释，实为拆股（核实 2026-08-25，源=FMP splits-company）。2026-08 曾亏损摊平，L14 留痕" }
  - { ticker: ASX,  role: "ASE Technology 台湾 OSAT ADR（NYSE，CIK 1122411，isAdr=true）：封装+测试+EMS，含 fan-out WLP / 2.5D 硅中介层等先进封装（核实 2026-08-25，源=FMP profile）。⚠️ 原注释「低毛利环节」需重估——先进封装占比在上升，别再用旧标签直接判它该走" }
  - { ticker: AAOI, role: "光模块（🚩稀释否决级：2026-08-21 新提交 $600M ATM 424B5，发行前流通股 84,906,289、净额约 $412M、用途 general corporate purposes；叠加流通股 YoY+35.6% 与此前 424B5x3。Serenity #7 = 结构性否决/封顶。核实于 2026-08-25，源=SEC 424B5 原文）" }
  - { ticker: GLW,  role: "Corning：**五大板块**（光通信 / 显示玻璃 / 特殊材料 / 汽车 / 生命科学），不是纯光通信标的（核实 2026-08-25，源=FMP profile）。原注释「光通信玻璃」只覆盖其中一块，会高估它对 AI 光模块周期的贝塔。曾破止损参考位" }
  - { ticker: SOXX, role: "半导体ETF（与单股持仓高度重复，处置方案第一批候选）" }
  - { ticker: CCXI, role: "Churchill Capital XI → **Agility Robotics** 人形机器人/Physical AI 的 de-SPAC（2026-06-24 签定最终合并协议，$2.5B 估值；2026-07-14 保密提交 S-4；Digit 已部署于 Amazon/Toyota/GXO）。⚠️ 2026-08-25 更正：此前注释写「SPAC空壳，体系外」是错的，且该错误曾把它推上处置清单第一位。合并未交割前仍是 SPAC 载体（FMP 行业仍标 Shell Companies），交割风险自负；两次亏损摊平 L18 留痕不变。" }
  - { ticker: RAM,  role: "2x杠杆ETF(Roundhill T-REX 2X Long DRAM)——红线v2窄门内合规(≈3.4%净值)；趋势工具：硬止损−15%/20日低，禁亏损加仓，负现金期间禁补仓" }
exclude: [IBKR]                    # 吉祥物，不计入分析

# AI 供应链子板块地图（取自 Serenity theses.md）——选股自下而上的池
subthemes:
  semis_gpu_asic:   { etfs: [SMH, SOXX], names: [NVDA, AVGO, MRVL, AMD, TSM, ALAB, ARM, INTC] }
  optical_cpo:      { etfs: [],          names: [LITE, COHR, AAOI, POET] }      # SIVE/IQE 海外/OTC 谨慎
  compound_semi:    { etfs: [],          names: [AXTI, TSEM] }
  memory_hbm:       { etfs: [],          names: [MU, SNDK, SIMO] }
  neocloud:         { etfs: [],          names: [NBIS, CRWV, CIFR, WULF] }
  power_grid:       { etfs: [XLU],       names: [VST, CEG, FLNC] }
  ai_software:      { etfs: [IGV],       names: [MSFT, ORCL, PLTR] }
  big_tech:         { etfs: [XLK, QQQ],  names: [] }
  # 以下四层来自「AI数据中心研究_十层框架_v1.md」(2026-08-23)，把研究结论回灌进雷达/扫描器视野
  networking_dc:    { etfs: [],          names: [ANET, ALAB, CRDO, CIEN] }        # L3 网络互连（COHR/LITE/AAOI 在 optical_cpo）
  power_equipment:  { etfs: [],          names: [GEV, ETN, NVT, HUBB, MOD] }      # L5 供配电 + L6 冷却（设备侧；发电侧见 power_grid）
  adv_packaging:    { etfs: [],          names: [AMKR, ONTO, CAMT] }              # L7 先进封装/检测（ASX 已持）
  energy_gas:       { etfs: [],          names: [ET, WMB, KMI, CCJ] }             # L9 能源基建 + 铀
  ai_apps:          { etfs: [],          names: [DUOL, APP, NOW, CRM] }           # AI 应用层（用户 2026-08-23 拍板；名单可随时增删）
benchmark: SPY

risk:                              # 移植 ai-hedge-fund risk_manager
  hist_window_days: 380                       # 取约1年日线给 EWMA波动率+长窗相关性（见 risk.py）
  single_name_hard_cap_pct_of_total: 12     # 后备硬顶
  # 波动率→上限 与 相关性→乘数 见 risk.py（与源码一致）
  no_chase_bias_threshold_pct: 5.0            # ZhuLinsen 默认；强趋势放宽 1.5x
  dilution_atm_disqualifier: true            # Serenity #7（需人工/SEC 复核）
  theme_exposure_alert_pct: 40               # B36 主题聚合敞口警戒线%（含杠杆倍数折算）
  # B53 (2026-08-24): 地图外持仓的层归属。缺这几行会让 _layer_of/_theme_exposure 把它们打成
  # "unmapped"——B36 显式豁免 unmapped 故主题警戒永不触发，而 _dispose_order 把 unmapped 读成
  # 「体系外/无框架容纳」并给出整只清仓建议。SKHY(第一大仓)一度因此被排在清仓第一位。
  theme_overrides:
    RAM:  memory_hbm         # 2x DRAM ETF（按 leverage_factors 折 2x 计入）
    SKHY: memory_hbm         # SK hynix ADR：内存双雄之一，subthemes 里只有 MU/SNDK/SIMO
    SOXX: semis_gpu_asic     # ETF 只在 subthemes.etfs 里，_theme_of 只读 names
    KLAC: adv_packaging      # 量测/检测设备（L7「检测」环节；前道设备层待单列）
    ASX:  adv_packaging      # OSAT 封测
    GLW:  optical_cpo        # 光通信玻璃
    CCXI: physical_ai       # B54 更正：不是空壳，是 Agility Robotics（人形机器人）的 de-SPAC。
                             # 不放进 subthemes.names —— 单成员层会让雷达的板块强弱表出一行无意义数据；
                             # theme_overrides 只影响 _layer_of / _theme_exposure，正是为此存在。
  leverage_factors: { RAM: 2.0 }             # 杠杆产品按基础敞口倍数计入主题敞口（红线v2⑥）
  profit_take_trigger_pct: 25                # B45 止盈触发：浮盈≥此值 提示减仓/上移止损
  profit_take_fraction: 0.33                 # B45 止盈建议减仓比例
  reentry_watch_days: 90                     # B44 再入场观察有效期（天）
  # B48 持仓体检（2026-08-23 用户拍板）：执行止损改用 20 日收盘低×0.99；200日线降级为趋势旗标
  high_conviction_rs: 20                     # RS(vs200−SPY) ≥ 此值 = 已证明相对领先 → 用高风险档
  risk_pct_high: 2.0                         # 高信念票单笔风险%（路线乙）
  risk_pct_base: 1.0                         # 其余持仓单笔风险%

data:
  primary: FMP                                # Starter 年付档（2026-07-18 由 Ultimate 降级；batch-quote 走单票 fallback，见 B31）
  positions: IBKR
  cross_validate: [SEC_EDGAR, YAHOO, 10-K/Q]  # 重大数字必须核；单一来源标「待验证」
  fail_open: true                             # 源失败→降级+标数据缺口，绝不阻塞/编造
  news_max_age_days: 3

schedule:
  daily_brief_cron_utc: "30 22 * * 1-5"  # B57 (2026-08-27) 盘中→盘后：22:30 UTC = 夏令时收盘+150分/冬令时收盘+90分，
                                         # 一个设置覆盖冬夏令时；台北固定 UTC+8 → 次日约 07:00 收到。
                                         # 收盘价口径下 20日低/止损位/距止损%/RS/热度才成立（此前顶部一直挂着「盘中快照，勿当收盘复盘」）。
                                         # calendars.market_phase 已有 postmarket 分支，代码无需改动。
                                         # ⚠️ 真正生效的 cron 在 .github/workflows/daily-brief.yml（设备写保护，须在 github.com 手改）
  biweekly_review_cron_utc: "23 2 * * 6" # 中国周六 10:23（避整点拥堵）；脚本内判隔周
  biweekly_anchor_date: "2026-06-27"     # 双周锚点（其后每14天）
  skip_us_holidays: true                 # exchange-calendars XNYS

scanner:                     # B28+B41 全市场新主线扫描（地图外发现；每日轮扫分片，Starter 额度友好）
  enabled: true
  min_mcap_usd: 2000000000   # 宇宙下限：市值 ≥ $2B
  min_price: 10              # 价格 ≥ $10
  min_dollar_vol_usd: 50000000  # 日成交额 ≥ $50M（价×量 后置过滤）
  near_high_pct: 5.0         # 距 52 周高 ≤5% 算贴近新高
  rs_min_vs_spy: 20          # RS 代理（vs200 − SPY vs200）达标线
  cluster_min_names: 3       # 同业 ≥3 只命中 = 疑似新主线簇
  cluster_suggest_days: 5    # 簇持续 ≥5 天 → 建议加入 subthemes（自然日近似）
  shard_size: 250            # 每日扫描票数（全宇宙 ~3-5 个交易日轮一遍）
  universe_refresh_days: 7   # 宇宙清单刷新周期

models:
  daily: claude-sonnet-4-6
  biweekly: claude-opus-4-8
  deep_dive: claude-opus-4-8

redlines:
  - 绝不自动下单/转账，只给提示，用户手动执行
  - 非投资建议；不确定标「待验证」、不编造
  - 陈述文件/数据前必须真读取（read-before-describing）
  - 杠杆ETF窄门（红线v2，2026-08-22 批准）：仅限2x做多；合计≤5%净值；账户负现金期间不得新开/补仓；硬止损−15%或20日低（先到者）无条件执行；对杠杆ETF亏损加仓=最高级违规；3x/反向/期货/期权卖方仍禁；红线修改仅在双周复盘日生效

alerts:                    # B14 盘中警报已于 2026-07-19 整体退役（workflow Disabled）；参数保留备一键复用
  intraday_move_pct: 6.0   # 日内涨跌幅绝对值 >= 此值 触发异动警报（B14）
  news_alerts: false       # 新闻警报已关(2026-07-11 用户反馈全是噪音)——破位/±6%异动警报保留；重开改 true
  intraday_cron_utc: "13,43 13-20 * * 1-5" # ~每30分钟·美股时段·避整点；脚本内再判 phase（仅 intraday/尾盘竞价）
